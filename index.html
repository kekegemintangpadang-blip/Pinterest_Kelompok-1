<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest - Beranda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIDEBAR KIRI -->
  <aside class="sidebar">
    <a href="#" class="side-btn logo" aria-label="Pinterest">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="#e60023"><path d="M12 0a12 12 0 0 0-4.37 23.17c-.1-.94-.2-2.4.04-3.44l1.4-5.96s-.36-.72-.36-1.78c0-1.66.96-2.9 2.16-2.9 1.02 0 1.51.77 1.51 1.68 0 1.02-.65 2.56-.99 3.98-.28 1.19.6 2.16 1.77 2.16 2.13 0 3.77-2.25 3.77-5.49 0-2.87-2.06-4.88-5.01-4.88-3.41 0-5.42 2.56-5.42 5.2 0 1.03.4 2.13.89 2.73a.36.36 0 0 1 .08.34l-.33 1.36c-.05.22-.17.27-.4.16-1.5-.7-2.43-2.89-2.43-4.65 0-3.78 2.75-7.26 7.92-7.26 4.16 0 7.4 2.96 7.4 6.93 0 4.14-2.6 7.47-6.22 7.47-1.21 0-2.36-.63-2.75-1.38l-.75 2.85c-.27 1.04-1 2.35-1.49 3.15A12 12 0 1 0 12 0z"/></svg>
    </a>
    <a href="#" class="side-btn active" data-nav="home" title="Beranda" aria-label="Beranda"><svg class="ico solid" viewBox="0 0 24 24"><path d="M12 3.2l8.5 7.3V20a1 1 0 0 1-1 1H14.5v-6h-5v6H4.5a1 1 0 0 1-1-1v-9.5z"/></svg></a>
    <a href="#" class="side-btn" data-nav="explore" title="Jelajahi" aria-label="Jelajahi"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></a>
    <a href="#" class="side-btn" data-nav="boards" title="Papan" aria-label="Papan"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 3.5v17M3.5 12H12"/></svg></a>
    <a href="#" class="side-btn" data-nav="create" title="Buat" aria-label="Buat"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 8v8M8 12h8"/></svg></a>
    <a href="#" class="side-btn" data-nav="notif" title="Notifikasi" aria-label="Notifikasi"><svg class="ico" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></a>
    <a href="#" class="side-btn" data-nav="messages" title="Pesan" aria-label="Pesan"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 1-4 16l-4.5 1 1-4.3A8.5 8.5 0 0 1 12 3.5z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01" stroke-width="3"/></svg></a>
    <a href="#" class="side-btn last" data-nav="settings" title="Pengaturan" aria-label="Pengaturan"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-width="3" stroke-dasharray="2.6 2.6"/><circle cx="12" cy="12" r="6.3"/><circle cx="12" cy="12" r="2.5"/></svg></a>
  </aside>

  <div class="content">
    <header class="topbar">
      <form class="search" onsubmit="return false">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <input type="text" placeholder="Cari">
        <svg class="ico cam" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
      </form>
      <div class="profile"><a href="#" class="avatar">K</a><svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
    </header>

    <!-- KATEGORI -->
    <section class="categories">
      <a href="#" class="chip active" data-category="semua">Semua</a>
      <a href="#" class="chip" data-category="kota">Kota</a>
      <a href="#" class="chip" data-category="arsitektur">Arsitektur</a>
      <a href="#" class="chip" data-category="alam">Alam</a>
      <a href="#" class="chip" data-category="pantai">Pantai &amp; Laut</a>
      <a href="#" class="chip" data-category="fotografi">Fotografi</a>
    </section>

    <!-- JUDUL (untuk Profil / Papan) -->
    <div id="heading" class="heading" hidden>
      <button class="hback" id="hback" data-do="back" aria-label="Kembali" hidden>←</button>
      <h1 id="htitle"></h1>
      <button id="hact" class="pill" data-do="" hidden></button>
    </div>

    <!-- GRID PIN (diisi oleh apk.js) -->
    <main class="pin-grid" id="grid"></main>

    <!-- DAFTAR PAPAN -->
    <section class="board-list" id="boards" hidden></section>
  </div>

  <!-- TOMBOL BANTUAN -->
  <a href="#" class="help-btn" aria-label="Bantuan">?</a>

  <!-- BOTTOM NAV (muncul di HP) -->
  <nav class="bottom-nav">
    <a href="#" class="active" data-nav="home">⌂<span>Beranda</span></a>
    <a href="#" data-nav="explore">⌕<span>Jelajahi</span></a>
    <a href="#" data-nav="create">＋<span>Buat</span></a>
    <a href="#" data-nav="messages">✉<span>Pesan</span></a>
    <a href="#" data-nav="profile">☺<span>Profil</span></a>
  </nav>

  <script src="apk.js"></script>
</body>
</html>
