<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest Clone - Beranda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="navbar">
    <a href="#" class="logo">
      <span class="logo-icon">P</span>
      <span class="logo-text">Pinterest</span>
    </a>

    <nav class="nav-links">
      <a href="#" class="active">Beranda</a>
      <a href="#">Jelajahi</a>
      <a href="#">Buat</a>
    </nav>

    <form class="search-box" onsubmit="return false">
      <input type="text" placeholder="Cari ide...">
    </form>

    <div class="nav-actions">
      <a href="#" class="btn btn-login">Masuk</a>
      <a href="#" class="btn btn-signup">Daftar</a>
    </div>
  </header>

  <!-- KATEGORI -->
  <section class="categories">
    <a href="#" class="chip active">Semua</a>
    <a href="#" class="chip">Dekorasi Rumah</a>
    <a href="#" class="chip">Resep</a>
    <a href="#" class="chip">Fashion</a>
    <a href="#" class="chip">Travel</a>
    <a href="#" class="chip">Seni</a>
    <a href="#" class="chip">Teknologi</a>
    <a href="#" class="chip">Tanaman</a>
  </section>

  <!-- GRID PIN -->
  <main class="pin-grid">
    <article class="pin lg"><div class="pin-inner"><img src="https://picsum.photos/seed/pin1/400/600" alt="Pin 1"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin sm"><div class="pin-inner"><img src="https://picsum.photos/seed/pin2/400/300" alt="Pin 2"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin md"><div class="pin-inner"><img src="https://picsum.photos/seed/pin3/400/450" alt="Pin 3"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin lg"><div class="pin-inner"><img src="https://picsum.photos/seed/pin4/400/620" alt="Pin 4"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin sm"><div class="pin-inner"><img src="https://picsum.photos/seed/pin5/400/320" alt="Pin 5"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin md"><div class="pin-inner"><img src="https://picsum.photos/seed/pin6/400/480" alt="Pin 6"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin lg"><div class="pin-inner"><img src="https://picsum.photos/seed/pin7/400/640" alt="Pin 7"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin sm"><div class="pin-inner"><img src="https://picsum.photos/seed/pin8/400/300" alt="Pin 8"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin md"><div class="pin-inner"><img src="https://picsum.photos/seed/pin9/400/460" alt="Pin 9"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin lg"><div class="pin-inner"><img src="https://picsum.photos/seed/pin10/400/600" alt="Pin 10"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin sm"><div class="pin-inner"><img src="https://picsum.photos/seed/pin11/400/310" alt="Pin 11"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin md"><div class="pin-inner"><img src="https://picsum.photos/seed/pin12/400/470" alt="Pin 12"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin lg"><div class="pin-inner"><img src="https://picsum.photos/seed/pin13/400/630" alt="Pin 13"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin sm"><div class="pin-inner"><img src="https://picsum.photos/seed/pin14/400/300" alt="Pin 14"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin md"><div class="pin-inner"><img src="https://picsum.photos/seed/pin15/400/450" alt="Pin 15"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
    <article class="pin lg"><div class="pin-inner"><img src="https://picsum.photos/seed/pin16/400/610" alt="Pin 16"><div class="overlay"><button class="save-btn">Simpan</button></div></div></article>
  </main>

</body>
</html>
